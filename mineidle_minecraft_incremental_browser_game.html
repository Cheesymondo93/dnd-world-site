}

// ----------------------------------------------------------------------------
// TAB 4: MULTI-STAGE CRAFTING TABLE
// ----------------------------------------------------------------------------
function renderCraftingTab() {
  const categories = ['Materials', 'Wooden Tools', 'Stone Tools', 'Iron Tools', 'Diamond Tools'];

  const sections = categories.map(cat => {
    const catRecipes = RECIPES.filter(r => r.category === cat);
    const cards = catRecipes.map(r => {
      const outItem = ITEMS[r.out];
      const maxBatch = getMaxCraftableBatch(r.id);
      const selectedQty = Math.max(1, Math.min(state.craftBatchSelection[r.id] || 1, Math.max(1, maxBatch)));
      const plan = resolveCraftingPlan(r.id, selectedQty);
      const isMultiStage = plan.stages.length > 1;
      const totalTime = plan.stages.reduce((s, st) => s + st.times * st.recipe.time, 0);

      const reqBadges = Object.entries(r.req).map(([reqId, reqQty]) => {
        const totalNeed = reqQty * selectedQty;
        const have = state.bank[reqId] || 0;
        const ok = have >= totalNeed;
        return `
          <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded border text-[11px] font-mono ${ok ? 'bg-melvor-bg border-melvor-border text-slate-200' : 'bg-amber-950/30 border-amber-500/30 text-amber-300'}">
            ${getItemSvg(ITEMS[reqId]?.icon || reqId, 14)}
            <span>${have}/${totalNeed} ${ITEMS[reqId]?.name}</span>
          </span>
        `;
      }).join('');

      const pipelineHtml = isMultiStage && plan.craftable ? `
        <div class="mt-2.5 p-2 rounded-lg bg-amber-500/10 border border-amber-500/30 text-[11px] text-amber-200">
          <span class="font-bold">⚡ Auto-Chain (${plan.stages.length} Stages):</span>
          ${plan.stages.map(s => `${s.times * s.recipe.count}x ${s.outputName}`).join(' → ')}
        </div>
      ` : '';

      const batchControls = `
        <div class="mt-3 pt-2.5 border-t border-melvor-border/60 flex items-center justify-between gap-2">
          <span class="text-[11px] font-mono text-slate-400">Batch: <strong class="text-white">${selectedQty}x</strong> (${selectedQty * r.count} items)</span>
          <div class="flex items-center gap-1">
            ${[1, 5, 10].map(n => `
              <button onclick="setCraftBatch('${r.id}', ${n})" class="px-2 py-0.5 rounded text-[11px] font-mono font-bold transition ${selectedQty === n ? 'bg-amber-500 text-slate-950' : 'bg-melvor-bg hover:bg-melvor-cardHover text-slate-300 border border-melvor-border'}">${n}x</button>
            `).join('')}
            <button onclick="setCraftBatch('${r.id}', ${Math.max(1, maxBatch)})" ${maxBatch <= 1 ? 'disabled' : ''} class="px-2 py-0.5 rounded text-[11px] font-mono font-bold transition ${maxBatch > 1 && selectedQty === maxBatch ? 'bg-amber-500 text-slate-950' : maxBatch > 1 ? 'bg-melvor-bg hover:bg-melvor-cardHover text-amber-300 border border-amber-500/40' : 'bg-melvor-bg text-slate-600 border border-melvor-border cursor-not-allowed'}">Max (${maxBatch})</button>
          </div>
        </div>
      `;

      return `
        <div class="bg-melvor-panel border border-melvor-border rounded-2xl p-4 flex flex-col justify-between shadow-md">
          <div>
            <div class="flex items-start justify-between gap-2">
              <div class="flex items-center gap-3">
                <div class="w-11 h-11 rounded-xl bg-melvor-card border border-melvor-border flex items-center justify-center">
                  ${getItemSvg(outItem.icon || r.out, 28)}
                </div>
                <div>
                  <h4 class="font-bold text-white text-sm">${outItem.name} <span class="text-amber-400 font-mono text-xs">x${r.count}</span></h4>
                  <p class="text-[11px] text-slate-400 mt-0.5">${outItem.desc}</p>
                </div>
              </div>
              <span class="text-[11px] font-mono text-slate-400 shrink-0">${totalTime.toFixed(1)}s</span>
            </div>

            <div class="mt-3 flex flex-wrap gap-1.5">${reqBadges}</div>
            ${pipelineHtml}
            ${batchControls}
          </div>

          <button onclick="startCrafting('${r.id}', ${selectedQty})" ${plan.craftable ? '' : 'disabled'} class="mt-3 w-full py-2 rounded-xl text-xs font-bold transition ${plan.craftable ? 'bg-melvor-craft hover:bg-amber-500 text-white shadow' : 'bg-melvor-bg text-slate-500 border border-melvor-border cursor-not-allowed'}">
            ${plan.craftable ? (isMultiStage ? `⚡ Auto-Craft ${selectedQty * r.count}x (${plan.stages.length} Stages)` : `🔨 Craft ${selectedQty * r.count}x ${outItem.name}`) : 'Missing Base Materials'}
          </button>
        </div>
      `;
    }).join('');

    return `
      <div>
        <h3 class="text-sm font-bold uppercase tracking-wider text-amber-400 mb-3">${cat}</h3>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">${cards}</div>
      </div>
    `;
  }).join('');

  return `
    <div>
      <h2 class="text-xl font-extrabold text-white">Crafting Table & Batch Queue</h2>
      <p class="text-xs text-slate-400">Queue up <strong class="text-amber-300">1x, 5x, 10x, or Max</strong> batches! Even if you lack intermediate Planks or Sticks, the workbench automatically chains base Logs through Stage 1 → Stage 2 → Final Item.</p>
    </div>
    <div class="space-y-6">${sections}</div>
  `;
}

// ----------------------------------------------------------------------------
// TAB 5: FURNACE SMELTING
// ----------------------------------------------------------------------------
function renderSmeltingTab() {
  const f = state.furnace;
  const activeRecipe = SMELTING_RECIPES.find(r => r.id === f.targetRecipeId);
  const smeltMult = getSmeltSpeedMult();

  const fuels = ['coal', 'charcoal', 'oak_log', 'planks'].map(id => {
    const qty = state.bank[id] || 0;
    const burn = id === 'coal' ? 40 : id === 'charcoal' ? 35 : id === 'oak_log' ? 12 : 8;
    if (!ITEMS[id].fuelTime) ITEMS[id].fuelTime = burn;
    return `
      <button onclick="addFurnaceFuel('${id}')" ${qty > 0 ? '' : 'disabled'} class="flex items-center justify-between px-3 py-2 rounded-xl border text-xs transition ${qty > 0 ? 'bg-melvor-card hover:bg-melvor-cardHover border-melvor-border text-slate-200' : 'bg-melvor-bg/50 border-melvor-border/50 text-slate-600 cursor-not-allowed'}">
        <span class="flex items-center gap-2">
          ${getItemSvg(id, 18)}
          <span>${ITEMS[id].name} (${qty})</span>
        </span>
        <span class="font-mono text-amber-400">+${burn}s</span>
      </button>
    `;
  }).join('');

  const recipeCards = SMELTING_RECIPES.map(r => {
    const isSelected = f.targetRecipeId === r.id;
    const haveIn = state.bank[r.inItem] || 0;
    const haveOut = state.bank[r.outItem] || 0;
    return `
      <div class="bg-melvor-panel border ${isSelected ? 'border-rose-500' : 'border-melvor-border'} rounded-2xl p-4 flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2.5">
              ${getItemSvg(r.inItem, 24)}
              <span class="text-slate-400 font-bold">→</span>
              ${getItemSvg(r.outItem, 26)}
              <div>
                <h4 class="font-bold text-white text-sm">${ITEMS[r.outItem].name}</h4>
                <span class="text-[11px] font-mono text-slate-400">${(r.time / smeltMult).toFixed(1)}s per smelt</span>
              </div>
            </div>
            <span class="text-xs font-mono bg-melvor-bg px-2 py-0.5 rounded border border-melvor-border text-slate-300">Bank: ${haveOut}</span>
          </div>
          <p class="text-xs text-slate-400 mt-2.5">${r.desc}</p>
        </div>
        <div class="mt-3 pt-3 border-t border-melvor-border/60 flex items-center justify-between">
          <span class="text-xs font-mono ${haveIn > 0 ? 'text-emerald-400' : 'text-slate-500'}">Input: ${haveIn} ${ITEMS[r.inItem].name}</span>
          <button onclick="setFurnaceRecipe('${r.id}')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition ${isSelected ? 'bg-rose-600 text-white' : 'bg-melvor-card hover:bg-melvor-cardHover text-slate-200 border border-melvor-border'}">
            ${isSelected ? '🔥 Smelting' : 'Select'}
          </button>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div>
      <h2 class="text-xl font-extrabold text-white">Stone Furnace</h2>
      <p class="text-xs text-slate-400">Runs passively in the background while you go on expeditions. Auto-feeds Coal & Charcoal when lit.</p>
    </div>

    <div class="bg-melvor-panel border border-melvor-border rounded-2xl p-5 shadow-lg grid grid-cols-1 md:grid-cols-2 gap-5">
      <div>
        <div class="flex items-center justify-between mb-2">
          <span class="text-xs font-bold uppercase tracking-wider text-rose-400">Active Smelting Slot</span>
          <span class="text-xs font-mono text-slate-400">Speed: ${smeltMult.toFixed(2)}x</span>
        </div>
        <div class="p-4 rounded-xl bg-melvor-bg border border-melvor-border">
          <div class="flex items-center justify-between mb-2">
            <span class="text-sm font-bold text-white">${activeRecipe ? `Smelting ${ITEMS[activeRecipe.outItem].name}` : 'No Recipe Selected'}</span>
            <span class="text-xl">${f.fuelRemaining > 0 ? '🔥' : '🪨'}</span>
          </div>
          <div class="w-full h-3 bg-melvor-panel rounded-full overflow-hidden border border-melvor-border">
            <div id="furnace-prog-bar" class="h-full bg-melvor-smelt transition-all duration-100 progress-stripe" style="width: ${Math.round(f.progress * 100)}%"></div>
          </div>
          <div class="mt-3 flex items-center justify-between text-xs">
            <span class="text-slate-400">Firebox Heat</span>
            <span id="furnace-fuel-text" class="font-mono text-amber-400">${f.fuelRemaining > 0 ? `${f.fuelRemaining.toFixed(1)}s burn left` : 'Out of fuel'}</span>
          </div>
          <div class="w-full h-2 bg-melvor-panel rounded-full overflow-hidden mt-1">
            <div id="furnace-fuel-bar" class="h-full bg-amber-500 transition-all duration-100" style="width: ${f.fuelMax > 0 ? Math.min(100, (f.fuelRemaining / f.fuelMax) * 100) : 0}%"></div>
          </div>
        </div>
      </div>

      <div>
        <div class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Stoke Firebox (Add Fuel)</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-2">${fuels}</div>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${recipeCards}</div>
  `;
}

// ----------------------------------------------------------------------------
// TAB 6: FARMING PLOTS
// ----------------------------------------------------------------------------
function renderFarmingTab() {
  const unlockedPlots = getBaseInfo().farmPlots;
  const isTending = state.activeTask?.type === 'tending';

  const plotCards = state.plots.map((plot, idx) => {
    if (idx >= unlockedPlots) {
      return `
        <div class="bg-melvor-panel/40 border border-dashed border-melvor-border rounded-2xl p-5 flex flex-col items-center justify-center text-center min-h-[210px]">
          <span class="text-2xl opacity-40">🔒</span>
          <div class="text-sm font-bold text-slate-500 mt-2">Locked Farm Plot #${idx + 1}</div>
          <p class="text-xs text-slate-600 mt-1">Expand your Home Base to unlock additional farmland.</p>
        </div>
      `;
    }

    if (!plot.cropId) {
      const seedButtons = CROPS.map(c => {
        const have = state.bank[c.id] || 0;
        return `
          <button onclick="plantCrop(${idx}, '${c.id}')" ${have > 0 ? '' : 'disabled'} class="flex items-center justify-between px-2.5 py-1.5 rounded-lg border text-xs transition ${have > 0 ? 'bg-melvor-card hover:bg-melvor-cardHover border-melvor-border text-slate-200' : 'bg-melvor-bg/40 border-melvor-border/40 text-slate-600 cursor-not-allowed'}">
            <span class="flex items-center gap-1.5 truncate">
              ${getItemSvg(ITEMS[c.id]?.icon || c.id, 16)}
              <span class="truncate">${c.name}</span>
            </span>
            <span class="font-mono text-[11px] ml-1">${have}</span>
          </button>
        `;
      }).join('');

      return `
        <div class="bg-melvor-panel border border-melvor-border rounded-2xl p-4 flex flex-col justify-between min-h-[210px]">
          <div>
            <div class="flex items-center justify-between mb-2">
              <span class="text-xs font-bold uppercase tracking-wider text-lime-400">Plot #${idx + 1} • Tilled Soil</span>
              <span class="text-[11px] text-slate-500">Empty</span>
            </div>
            <p class="text-xs text-slate-400 mb-3">Select seeds or a tree sapling to plant:</p>
            <div class="grid grid-cols-1 gap-1.5">${seedButtons}</div>
          </div>
        </div>
      `;
    }

    const crop = CROPS.find(c => c.id === plot.cropId);
    const pct = Math.min(100, Math.round((plot.elapsed / crop.growTime) * 100));
    const ready = pct >= 100;

    return `
      <div class="bg-melvor-panel border ${ready ? 'border-emerald-500 active-glow' : 'border-melvor-border'} rounded-2xl p-5 flex flex-col justify-between min-h-[210px]">
        <div>
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold uppercase tracking-wider text-lime-400">Plot #${idx + 1}</span>
            <span id="plot-status-${idx}" class="text-xs font-mono ${ready ? 'font-bold text-emerald-400' : 'text-slate-400'}">
              ${ready ? 'Ready to Harvest!' : `Growing (${Math.ceil(crop.growTime - plot.elapsed)}s)`}
            </span>
          </div>
          <div class="flex items-center gap-3 mt-3">
            <div class="w-12 h-12 rounded-xl bg-melvor-card border border-melvor-border flex items-center justify-center">
              ${getItemSvg(crop.yieldItem, 28)}
            </div>
            <div>
              <h4 class="font-bold text-white text-base">${crop.name}</h4>
              <p class="text-xs text-slate-400">Yields ${crop.yieldMin}-${crop.yieldMax} ${ITEMS[crop.yieldItem].name}</p>
            </div>
          </div>
          <div class="w-full h-3 bg-melvor-bg rounded-full overflow-hidden border border-melvor-border mt-4">
            <div id="plot-bar-${idx}" class="h-full bg-melvor-farm transition-all duration-100 progress-stripe" style="width: ${pct}%"></div>
          </div>
        </div>

        <div class="mt-4 grid grid-cols-2 gap-2">
          <button onclick="harvestPlot(${idx}, false)" ${ready ? '' : 'disabled'} class="py-2 rounded-xl text-xs font-bold transition ${ready ? 'bg-emerald-600 hover:bg-emerald-500 text-white' : 'bg-melvor-bg text-slate-600 border border-melvor-border cursor-not-allowed'}">
            Harvest
          </button>
          <button onclick="harvestPlot(${idx}, true)" ${ready ? '' : 'disabled'} class="py-2 rounded-xl text-xs font-bold transition ${ready ? 'bg-lime-600 hover:bg-lime-500 text-white' : 'bg-melvor-bg text-slate-600 border border-melvor-border cursor-not-allowed'}">
            Harvest & Replant
          </button>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <h2 class="text-xl font-extrabold text-white">Homestead Farming Plots</h2>
        <p class="text-xs text-slate-400">Crops & saplings grow passively. Actively tending crops boosts growth speed and auto-harvests.</p>
      </div>
      <button onclick="${isTending ? 'stopCurrentAction()' : 'startTendingCrops()'}" class="px-4 py-2 rounded-xl text-xs font-bold transition shrink-0 ${isTending ? 'bg-rose-600 hover:bg-rose-500 text-white' : 'bg-melvor-farm hover:bg-lime-500 text-slate-950 shadow'}">
        ${isTending ? 'Stop Tending Plots' : '🌾 Actively Tend & Auto-Harvest'}
      </button>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${plotCards}</div>
  `;
}

              <p class="text-xs text-slate-400">Produces <strong class="text-slate-200">${ITEMS[spec.produceItem].name}</strong>${spec.bonusItem ? ` + ${ITEMS[spec.bonusItem].name}` : ''}</p>
            </div>
          </div>

          <div class="mt-3">
            <div class="flex justify-between text-[11px] font-mono text-slate-400 mb-1">
              <span>Passive Harvest Cycle</span>
              <span id="pen-pct-${idx}">${pct}%</span>
            </div>
            <div class="w-full h-2.5 bg-melvor-bg rounded-full overflow-hidden border border-melvor-border">
              <div id="pen-bar-${idx}" class="h-full bg-amber-500 transition-all duration-100 progress-stripe" style="width: ${pct}%"></div>
            </div>
          </div>
        </div>

        <div class="mt-4 space-y-2">
          <div class="grid grid-cols-2 gap-2">
            <button onclick="breedAnimalsInPen(${idx})" ${canBreed ? '' : 'disabled'} class="py-2 px-2 rounded-xl text-xs font-bold transition ${canBreed ? 'bg-pink-600 hover:bg-pink-500 text-white' : 'bg-melvor-bg text-slate-500 border border-melvor-border cursor-not-allowed'}" title="Requires 2+ animals and ${spec.breedCost}x ${ITEMS[spec.breedFood].name}">
              ❤️ Breed (${spec.breedCost} ${ITEMS[spec.breedFood].name})
            </button>
            <button onclick="assignAnimalToPen(${idx}, '${pen.species}')" ${haveSpare > 0 && pen.count < 8 ? '' : 'disabled'} class="py-2 px-2 rounded-xl text-xs font-bold transition ${haveSpare > 0 && pen.count < 8 ? 'bg-melvor-card hover:bg-melvor-cardHover text-slate-200 border border-melvor-border' : 'bg-melvor-bg text-slate-600 border border-melvor-border cursor-not-allowed'}">
              + Add (${haveSpare})
            </button>
          </div>
          <button onclick="harvestPenAnimalForMeat(${idx})" class="w-full py-1.5 rounded-lg bg-rose-950/40 hover:bg-rose-900/60 border border-rose-800/40 text-rose-300 text-[11px] font-semibold transition">
            🍖 Butcher 1 ${spec.name} for Meat
          </button>
        </div>
      </div>
    `;
  }).join('');

  return `
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
      <div>
        <h2 class="text-xl font-extrabold text-white">Livestock Pens & Ranching</h2>
        <p class="text-xs text-slate-400">Craft <strong class="text-amber-300">Oak Fences (4 Planks + 2 Sticks)</strong> and <strong class="text-amber-300">Fence Gates (2 Planks + 4 Sticks)</strong> to build pens. Keep <strong class="text-lime-300">Wheat</strong> or <strong class="text-orange-300">Carrots</strong> in your bank during Woodcutting walks to lure wild Cows, Sheep, and Pigs!</p>
      </div>
      <div class="text-xs font-mono bg-melvor-panel border border-melvor-border px-3 py-1.5 rounded-lg text-amber-300 shrink-0">
        Shears: ${hasShears ? '✂️ Active (2x Wool)' : 'None'} • Yield: ${getRanchYieldMult().toFixed(2)}x
      </div>
    </div>
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${penCards}</div>
  `;
}

// ----------------------------------------------------------------------------
// 11. MODALS (ITEM DETAILS, EXPORT/IMPORT SAVE, RESET)
// ----------------------------------------------------------------------------
function openItemModal(itemId) {
  const item = ITEMS[itemId];
  const qty = state.bank[itemId] || 0;
  if (!item || qty <= 0) return;

  document.getElementById('modal-title').textContent = `${item.name} (x${qty})`;
  const isTool = item.category === 'tool';
  document.getElementById('modal-content').innerHTML = `
    <div class="flex items-center gap-3 p-3 rounded-xl bg-melvor-bg border border-melvor-border">
      <div class="w-12 h-12 rounded-lg bg-melvor-panel border border-melvor-border flex items-center justify-center">
        ${getItemSvg(item.icon || itemId, 32)}
      </div>
      <div>
        <div class="text-xs uppercase font-bold text-slate-400">${item.category}</div>
        <div class="text-xs text-slate-300 mt-0.5">${item.desc}</div>
      </div>
    </div>
    <div class="flex flex-wrap gap-2 pt-2">
      ${isTool ? `<button onclick="equipToolFromBank('${itemId}'); closeModal();" class="flex-1 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold">Equip Tool</button>` : ''}
      <button onclick="dropItem('${itemId}', 1)" class="flex-1 py-2 rounded-lg bg-melvor-card hover:bg-melvor-cardHover border border-melvor-border text-slate-200 text-xs font-semibold">Drop 1</button>
      ${qty >= 10 ? `<button onclick="dropItem('${itemId}', 10)" class="flex-1 py-2 rounded-lg bg-melvor-card hover:bg-melvor-cardHover border border-melvor-border text-slate-200 text-xs font-semibold">Drop 10</button>` : ''}
      <button onclick="dropItem('${itemId}', ${qty})" class="flex-1 py-2 rounded-lg bg-rose-950/60 hover:bg-rose-900 border border-rose-700/50 text-rose-200 text-xs font-semibold">Drop All (${qty})</button>
    </div>
    <div class="flex items-center gap-2 pt-1">
      <input id="custom-drop-input" type="number" min="1" max="${qty}" value="${Math.min(5, qty)}" class="w-24 px-2.5 py-1.5 rounded-lg bg-melvor-bg border border-melvor-border text-xs font-mono text-white focus:outline-none focus:border-rose-500" />
      <button onclick="dropCustomAmount('${itemId}')" class="flex-1 py-1.5 rounded-lg bg-rose-900/60 hover:bg-rose-800 border border-rose-700/50 text-rose-100 text-xs font-semibold transition">Drop Custom Amount</button>
    </div>
  `;
  document.getElementById('modal-backdrop').classList.remove('hidden');
  document.getElementById('modal-backdrop').classList.add('flex');
}

function dropCustomAmount(itemId) {
  const input = document.getElementById('custom-drop-input');
  const have = state.bank[itemId] || 0;
  const amount = Math.max(1, Math.min(have, parseInt(input?.value || '0', 10) || 0));
  if (amount > 0) dropItem(itemId, amount);
}

function dropItem(itemId, qty) {
  removeFromBank(itemId, qty);
  addLog(`🗑️ Discarded ${qty}x ${ITEMS[itemId]?.name || itemId}.`);
  closeModal();
  renderAll();
}

function openSaveModal() {
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
  document.getElementById('modal-title').textContent = 'Export / Import Save Data';
  document.getElementById('modal-content').innerHTML = `
    <p class="text-xs text-slate-400">Copy your save string to back it up, or paste a save string below to restore:</p>
    <textarea id="save-data-box" rows="4" class="w-full p-2.5 rounded-lg bg-melvor-bg border border-melvor-border font-mono text-[11px] text-slate-200 focus:outline-none">${encoded}</textarea>
    <div class="flex gap-2">
      <button onclick="copySaveString()" class="flex-1 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold">Copy to Clipboard</button>
      <button onclick="importSaveString()" class="flex-1 py-2 rounded-lg bg-blue-600 hover:bg-blue-500 text-white text-xs font-bold">Import Save</button>
    </div>
  `;
  document.getElementById('modal-backdrop').classList.remove('hidden');
  document.getElementById('modal-backdrop').classList.add('flex');
}

function copySaveString() {
  const box = document.getElementById('save-data-box');
  box.select();
  document.execCommand('copy');
  showToast('Save string copied to clipboard!', 'emerald');
}

function importSaveString() {
  try {
    const raw = document.getElementById('save-data-box').value.trim();
    const decoded = JSON.parse(decodeURIComponent(escape(atob(raw))));
    if (!decoded || typeof decoded !== 'object' || !decoded.bank) throw new Error('Invalid');
    state = { ...createDefaultState(), ...decoded };
    saveState(true);
    closeModal();
    renderAll();
    showToast('Save imported successfully!', 'emerald');
  } catch (e) {
    showToast('Invalid save string!', 'rose');
  }
}

function confirmResetModal() {
  document.getElementById('modal-title').textContent = 'Reset Game Progress?';
  document.getElementById('modal-content').innerHTML = `
    <p class="text-xs text-slate-300">Are you sure you want to wipe your Home Base, tools, and bank items to start fresh?</p>
    <div class="flex gap-2 pt-2">
      <button onclick="closeModal()" class="flex-1 py-2 rounded-lg bg-melvor-card border border-melvor-border text-slate-200 text-xs font-semibold">Cancel</button>
      <button onclick="executeReset()" class="flex-1 py-2 rounded-lg bg-rose-600 hover:bg-rose-500 text-white text-xs font-bold">Yes, Wipe Save</button>
    </div>
  `;
  document.getElementById('modal-backdrop').classList.remove('hidden');
  document.getElementById('modal-backdrop').classList.add('flex');
}

function executeReset() {
  state = createDefaultState();
  saveState(true);
  closeModal();
  renderAll();
  showToast('World reset to Day 1.', 'amber');
}

function closeModal() {
  document.getElementById('modal-backdrop').classList.add('hidden');
  document.getElementById('modal-backdrop').classList.remove('flex');
}

// ----------------------------------------------------------------------------
// 12. INITIALIZATION
// ----------------------------------------------------------------------------
window.addEventListener('DOMContentLoaded', () => {
  const logo = getItemSvg('diamond_pickaxe', 20);
  const b1 = document.getElementById('brand-logo');
  const b2 = document.getElementById('brand-logo-mobile');
  if (b1) b1.innerHTML = logo;
  if (b2) b2.innerHTML = logo;

  const soundIcon = state.settings.sound ? '🔊' : '🔇';
  document.getElementById('audio-btn-desktop').textContent = soundIcon;
  document.getElementById('audio-btn-mobile').textContent = soundIcon;

  renderAll();
  setInterval(gameTick, TICK_MS);
});
</script>
