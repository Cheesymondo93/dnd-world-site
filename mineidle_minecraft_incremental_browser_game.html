    ::-webkit-scrollbar-thumb:hover { background: #455063; }

    .pixel-icon {
      image-rendering: pixelated;
      shape-rendering: crispEdges;
    }

    @keyframes floatUp {
      0% { opacity: 1; transform: translateY(0px) scale(0.95); }
      20% { transform: translateY(-8px) scale(1.03); }
      100% { opacity: 0; transform: translateY(-34px) scale(0.98); }

      animation: floatUp 1.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      pointer-events: none;
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 0 0 rgba(74, 143, 231, 0.25); }

    }
    .active-glow {
      animation: pulseGlow 2.2s infinite;
    }

    .progress-stripe {
      background-image: linear-gradient(

        rgba(255, 255, 255, 0.12) 25%,
        transparent 25%,
        transparent 50%,
        rgba(255, 255, 255, 0.12) 50%,
        rgba(255, 255, 255, 0.12) 75%,
        transparent 75%,

<script>
/**
 * ============================================================================
 * MINEIDLE — MELVOR-INSPIRED MINECRAFT INCREMENTAL ENGINE
 * ============================================================================
 * Architecture:
 * 1. SVG Pixel Art Generator (clean crisp Minecraft block & tool icons)
 * 2. Game Data Definitions (Items, Base Tiers, Trees, Mines, Recipes, Smelting, Crops)
 * 3. State Management & LocalStorage Persistence
 * 4. Recursive Multi-Stage Crafting Resolver (auto-plans intermediate steps)
 * 5. Simulation Engine (100ms tick loop handling Expeditions, Crafting, Smelting, Farming)
 * 6. Responsive Melvor-style UI Renderer & Web Audio Synthesizer
 */

// ----------------------------------------------------------------------------
// 1. WEB AUDIO RETRO SOUND SYNTHESIZER (Zero external audio files)
// ----------------------------------------------------------------------------
let audioCtx = null;
function playSfx(type) {
  if (!state.settings.sound) return;
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    const now = audioCtx.currentTime;

    if (type === 'chop') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.exponentialRampToValueAtTime(65, now + 0.08);
      gain.gain.setValueAtTime(0.14, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.start(now); osc.stop(now + 0.09);
    } else if (type === 'mine') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(180, now + 0.07);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
      osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'craft' || type === 'loot') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(520, now);
      osc.frequency.setValueAtTime(780, now + 0.06);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.16);
      osc.start(now); osc.stop(now + 0.16);
    } else if (type === 'break') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(220, now);
      osc.frequency.linearRampToValueAtTime(55, now + 0.25);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.26);
      osc.start(now); osc.stop(now + 0.26);
    } else if (type === 'build') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(190, now);
      osc.frequency.exponentialRampToValueAtTime(110, now + 0.09);
      gain.gain.setValueAtTime(0.11, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    }
  } catch (e) { /* Ignore audio errors on restricted contexts */ }
}

// ----------------------------------------------------------------------------
// 2. SVG PIXEL-ART ICON GENERATOR
// ----------------------------------------------------------------------------
function getItemSvg(iconKey, size = 28) {
  const s = `width="${size}" height="${size}" viewBox="0 0 16 16" class="pixel-icon shrink-0"`;
  const icons = {
    oak_log: `<svg ${s}><rect x="2" y="2" width="12" height="12" rx="1" fill="#6b4423"/><rect x="3" y="3" width="10" height="10" fill="#b8945f"/><rect x="5" y="5" width="6" height="6" fill="#9c7a48"/><rect x="7" y="7" width="2" height="2" fill="#6b4423"/></svg>`,
    birch_log: `<svg ${s}><rect x="2" y="2" width="12" height="12" rx="1" fill="#e6e4dc"/><rect x="3" y="4" width="3" height="2" fill="#3a3a38"/><rect x="9" y="8" width="4" height="2" fill="#3a3a38"/><rect x="4" y="11" width="3" height="1" fill="#3a3a38"/></svg>`,
    spruce_log: `<svg ${s}><rect x="2" y="2" width="12" height="12" rx="1" fill="#3b2511"/><rect x="3" y="3" width="10" height="10" fill="#6e4b2a"/><rect x="5" y="5" width="6" height="6" fill="#52361c"/></svg>`,
    dark_oak_log: `<svg ${s}><rect x="2" y="2" width="12" height="12" rx="1" fill="#291a0c"/><rect x="3" y="3" width="10" height="10" fill="#473018"/><rect x="6" y="6" width="4" height="4" fill="#291a0c"/></svg>`,
    planks: `<svg ${s}><rect x="2" y="2" width="12" height="12" rx="1" fill="#b8945f"/><rect x="2" y="5" width="12" height="1" fill="#7d5c32"/><rect x="2" y="9" width="12" height="1" fill="#7d5c32"/><rect x="2" y="12" width="12" height="1" fill="#7d5c32"/><rect x="7" y="2" width="1" height="3" fill="#7d5c32"/><rect x="11" y="6" width="1" height="3" fill="#7d5c32"/></svg>`,
    stick: `<svg ${s}><path d="M11 3h2v2h-2v2H9v2H7v2H5v2H3v-2h2V9h2V7h2V5h2V3z" fill="#9c7a48"/><path d="M11 3h1v1h-1v2H9v2H7v2H5v2H3v-1h2V9h2V7h2V5h2V3z" fill="#c29e67"/></svg>`,
    oak_fence: `<svg ${s}><rect x="3" y="2" width="3" height="12" fill="#9c7a48"/><rect x="10" y="2" width="3" height="12" fill="#9c7a48"/><rect x="2" y="5" width="12" height="2" fill="#b8945f"/><rect x="2" y="10" width="12" height="2" fill="#b8945f"/></svg>`,
    fence_gate: `<svg ${s}><rect x="2" y="3" width="2" height="11" fill="#7d5c32"/><rect x="12" y="3" width="2" height="11" fill="#7d5c32"/><rect x="4" y="5" width="8" height="2" fill="#b8945f"/><rect x="4" y="10" width="8" height="2" fill="#b8945f"/><rect x="7" y="4" width="2" height="9" fill="#9c7a48"/></svg>`,

    return icons.axe(pal[0], pal[1]);
  }
  if (iconKey.endsWith('_pickaxe')) {
    const pal = { wooden: ['#b8945f','#cfa972'], stone: ['#8c8c8c','#a8a8a8'], iron: ['#d4d4d4','#ffffff'], diamond: ['#3de0d2','#9efaf2'] }[iconKey.split('_')[0]];
    return icons.pickaxe(pal[0], pal[1]);
  }
  if (iconKey.endsWith('_hoe')) {
    const pal = { wooden: ['#b8945f','#cfa972'], stone: ['#8c8c8c','#a8a8a8'], iron: ['#d4d4d4','#ffffff'], diamond: ['#3de0d2','#9efaf2'] }[iconKey.split('_')[0]];
    return icons.hoe(pal[0], pal[1]);
  }
  return icons[iconKey] || icons.cobblestone;
}

let state = loadState();

function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return createDefaultState();
    const parsed = JSON.parse(raw);
    const def = createDefaultState();
    return {
      ...def,
      ...parsed,
      extensions: { ...def.extensions, ...(parsed.extensions || {}) },
      equipped: { ...def.equipped, ...(parsed.equipped || {}) },
      furnace: { ...def.furnace, ...(parsed.furnace || {}) },
      pens: Array.isArray(parsed.pens) ? def.pens.map((p, i) => ({ ...p, ...(parsed.pens[i] || {}) })) : def.pens,
      stats: { ...def.stats, ...(parsed.stats || {}) },
      settings: { ...def.settings, ...(parsed.settings || {}) }
    };
  } catch (e) {
    return createDefaultState();
  }
}

function saveState(silent = true) {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    const el = document.getElementById('last-saved-text');
    if (el) {
      const now = new Date();
      el.textContent = now.toTimeString().slice(0, 5);
    }
    if (!silent) showToast('Game progress saved!', 'emerald');
  } catch (e) {
    showToast('Failed to save to LocalStorage.', 'rose');
  }
}

function manualSave() {
  saveState(false);
}

// ----------------------------------------------------------------------------
// 5. INVENTORY & HELPER UTILITIES
// ----------------------------------------------------------------------------
function getBaseInfo() {
  return BASE_TIERS[state.baseLevel] || BASE_TIERS[0];
}

function getExtLevel(extId) {
  return state.extensions?.[extId] || 0;
}

function getTotalStoredItems() {
  return Object.values(state.bank).reduce((acc, qty) => acc + (qty > 0 ? qty : 0), 0);
}

function getStorageCap() {
  return getBaseInfo().storageCap + getExtLevel('storage_cellar') * 120;
}

function getMaxPens() {
  return Math.min(7, getBaseInfo().maxPens + getExtLevel('barn_wing'));
}

function getTravelSpeedMult() {
  return 1 + getBaseInfo().travelBonus + getExtLevel('watchtower') * 0.10;
}

function getSmeltSpeedMult() {
  return 1 + getBaseInfo().smeltBonus + getExtLevel('smeltery_chimney') * 0.15;
}

function getPouchCapacity() {
  return 24 + getExtLevel('pantry') * 4;
}

function getRanchYieldMult() {
  return 1 + getExtLevel('barn_wing') * 0.15 + getExtLevel('pantry') * 0.15;
}

function addToBank(itemId, qty, showPopup = true) {
  if (!qty || qty <= 0) return 0;
  const cap = getStorageCap();
  const current = getTotalStoredItems();
  const space = Math.max(0, cap - current);
  const actual = Math.min(qty, space);

  if (actual > 0) {
    state.bank[itemId] = (state.bank[itemId] || 0) + actual;
    if (showPopup) {
      spawnFloatingText(`+${actual} ${ITEMS[itemId]?.name || itemId}`, 'emerald');
    }
  }
  if (actual < qty) {
    addLog(`⚠️ Home Base storage full (${cap})! Could not store ${qty - actual}x ${ITEMS[itemId]?.name}.`);
  }
  return actual;
}

function removeFromBank(itemId, qty) {
  const have = state.bank[itemId] || 0;
  if (have < qty) return false;
  state.bank[itemId] = have - qty;
  if (state.bank[itemId] <= 0) delete state.bank[itemId];
  return true;
}

function addLog(msg) {
  const time = new Date().toTimeString().slice(0, 5);
  state.logs.unshift(`[${time}] ${msg}`);
  if (state.logs.length > 35) state.logs.pop();
  const latestEl = document.getElementById('activity-log-latest');
  if (latestEl) latestEl.textContent = state.logs[0];
  renderLogDrawer();
}

function renderLogDrawer() {
  const drawer = document.getElementById('activity-log-drawer');
  if (!drawer) return;
  drawer.innerHTML = state.logs.map(l => `<div class="border-b border-melvor-border/30 pb-0.5">${l}</div>`).join('');
}

function toggleLogHistory() {
  document.getElementById('activity-log-drawer').classList.toggle('hidden');
}

function spawnFloatingText(text, color = 'emerald') {
  const container = document.getElementById('floating-layer');
  if (!container) return;
  const el = document.createElement('div');
  const colorMap = {
    emerald: 'text-emerald-300 bg-emerald-950/90 border-emerald-500/50',
    blue: 'text-blue-300 bg-blue-950/90 border-blue-500/50',
    amber: 'text-amber-300 bg-amber-950/90 border-amber-500/50',
    rose: 'text-rose-300 bg-rose-950/90 border-rose-500/50'
  };
  el.className = `float-popup fixed right-6 top-24 px-3 py-1 rounded-full border text-xs font-bold shadow-lg ${colorMap[color] || colorMap.emerald}`;
  // Slight horizontal jitter so stacked popups are readable
  el.style.right = `${20 + Math.floor(Math.random() * 45)}px`;
  el.textContent = text;
  container.appendChild(el);
  setTimeout(() => el.remove(), 1350);
}

function showToast(msg, color = 'emerald') {
  const container = document.getElementById('toast-container');
  const el = document.createElement('div');
  const borderClass = color === 'rose' ? 'border-rose-500/60 bg-rose-950/95 text-rose-100' : 'border-emerald-500/60 bg-melvor-panel/95 text-emerald-100';
  el.className = `pointer-events-auto px-4 py-3 rounded-xl border shadow-xl text-xs font-medium flex items-center justify-between gap-3 transition-all ${borderClass}`;
  el.innerHTML = `<span>${msg}</span><button onclick="this.parentElement.remove()" class="text-slate-400 hover:text-white">✕</button>`;
  container.appendChild(el);
  setTimeout(() => { if (el.parentElement) el.remove(); }, 3500);
}

// ----------------------------------------------------------------------------
// 6. TOOL DURABILITY & EQUIPPING SYSTEM
// ----------------------------------------------------------------------------
function equipToolFromBank(itemId) {
  const item = ITEMS[itemId];
  if (!item || item.category !== 'tool') return;
  if (!removeFromBank(itemId, 1)) return;

  // If another tool is already equipped in that slot, return it to bank (if full durability) or warn
  const current = state.equipped[item.slot];
  if (current) {
    if (current.durability === current.maxDurability) {
      addToBank(current.id, 1, false);
    } else {
      addLog(`Replaced worn ${ITEMS[current.id].name} (${current.durability}/${current.maxDurability} dur).`);
    }
  }

  state.equipped[item.slot] = {
    id: itemId,
    durability: item.maxDurability,
    maxDurability: item.maxDurability
  };
  playSfx('craft');
  addLog(`Equipped ${item.name} (${item.maxDurability} durability).`);
  renderAll();
}

function consumeToolDurability(slot, amount = 1) {
  const tool = state.equipped[slot];
  if (!tool) return;
  // Tool Shed extension gives a chance to conserve durability
  const saveChance = getExtLevel('tool_shed') * 0.12;
  if (saveChance > 0 && Math.random() < saveChance) return;

  tool.durability = Math.max(0, tool.durability - amount);
  if (tool.durability <= 0) {
    const brokenName = ITEMS[tool.id].name;
    const brokenId = tool.id;
    state.equipped[slot] = null;
    playSfx('break');
    spawnFloatingText(`💥 ${brokenName} Broke!`, 'rose');
    addLog(`💥 Your ${brokenName} shattered!`);

    // Auto-equip replacement of same type from bank if available
    if ((state.bank[brokenId] || 0) > 0) {
      equipToolFromBank(brokenId);
      addLog(`Automatically equipped spare ${brokenName} from bank.`);
    }
    renderSidebarTools();
  }
}

function getToolTier(slot) {
  const eq = state.equipped[slot];
  return eq ? ITEMS[eq.id].tier : 0;
}

function getToolSpeedMult(slot) {
  const eq = state.equipped[slot];
  return eq ? ITEMS[eq.id].speedMult : 1.0;
}

// ----------------------------------------------------------------------------
// 7. RECURSIVE MULTI-STAGE CRAFTING RESOLVER (WITH BATCH SUPPORT)
// ----------------------------------------------------------------------------
/**
 * Computes whether `batchQty` of a recipe can be crafted directly OR via multi-stage
 * intermediate crafts using raw base items in the player's bank!
 * Returns:
 *   { craftable: boolean, stages: [ { recipe, times, outputName } ], missing: { itemId: qty } }
 */
function resolveCraftingPlan(targetRecipeId, batchQty = 1) {
  const targetRecipe = RECIPES.find(r => r.id === targetRecipeId);
  if (!targetRecipe || batchQty < 1) return { craftable: false, stages: [], missing: {} };

  // Clone current bank inventory to simulate consumption
  const simBank = { ...state.bank };
  const stages = [];
  const missing = {};

  function satisfy(itemId, neededQty) {
    const have = simBank[itemId] || 0;
    if (have >= neededQty) {
      simBank[itemId] = have - neededQty;
      return true;
    }

    // Consume whatever we already have
    const deficit = neededQty - have;
    simBank[itemId] = 0;

    // Find recipes that produce itemId
    const subRecipes = RECIPES.filter(r => r.out === itemId);
    if (subRecipes.length === 0) {
      missing[itemId] = (missing[itemId] || 0) + deficit;
      return false;
    }

    // Pick the first sub-recipe whose ingredients can be satisfied (handles oak/birch/spruce planks!)
    for (const sub of subRecipes) {
      const snapshotBank = { ...simBank };
      const snapshotStagesLen = stages.length;
      const snapshotMissing = { ...missing };

      const craftsNeeded = Math.ceil(deficit / sub.count);
      let possible = true;

      for (const [reqItem, reqPerCraft] of Object.entries(sub.req)) {
        if (!satisfy(reqItem, reqPerCraft * craftsNeeded)) {
          possible = false;
        }
      }

      if (possible) {
        // Add leftover surplus from batch output to simBank
        const totalProduced = craftsNeeded * sub.count;
        simBank[itemId] = (simBank[itemId] || 0) + (totalProduced - deficit);

        // Merge with existing stage if same recipe already queued
        const existing = stages.find(s => s.recipe.id === sub.id);
        if (existing) {
          existing.times += craftsNeeded;
        } else {
          stages.push({
            recipe: sub,
            times: craftsNeeded,
            outputName: ITEMS[sub.out].name
          });
        }
        return true;
      } else {
        // Restore snapshot and try next alternative recipe (e.g., Birch Logs instead of Oak Logs)
        Object.keys(simBank).forEach(k => delete simBank[k]);
        Object.assign(simBank, snapshotBank);
        stages.length = snapshotStagesLen;
        Object.keys(missing).forEach(k => delete missing[k]);
        Object.assign(missing, snapshotMissing);
      }
    }

    // None of the sub-recipes succeeded; record base missing from first recipe
    const fallbackSub = subRecipes[0];
    const craftsNeeded = Math.ceil(deficit / fallbackSub.count);
    for (const [reqItem, reqPerCraft] of Object.entries(fallbackSub.req)) {
      satisfy(reqItem, reqPerCraft * craftsNeeded);
    }
    return false;
  }

  // Satisfy all requirements of targetRecipe * batchQty
  let allOk = true;
  for (const [reqItem, reqQty] of Object.entries(targetRecipe.req)) {
    if (!satisfy(reqItem, reqQty * batchQty)) {
      allOk = false;
    }
  }

  // Final stage is the target recipe itself repeated `batchQty` times
  stages.push({
    recipe: targetRecipe,
    times: batchQty,
    outputName: ITEMS[targetRecipe.out].name
  });

  return {
    craftable: allOk,
    stages,
    missing
  };
}

function getMaxCraftableBatch(recipeId) {
  const recipe = RECIPES.find(r => r.id === recipeId);
  if (!recipe) return 0;
  if (!resolveCraftingPlan(recipeId, 1).craftable) return 0;

  let low = 1;
  let high = 250;
  let best = 1;
  while (low <= high) {
    const mid = Math.floor((low + high) / 2);
    if (resolveCraftingPlan(recipeId, mid).craftable) {
      best = mid;
      low = mid + 1;
    } else {
      high = mid - 1;
    }
  }
  return best;
}

function setCraftBatch(recipeId, qty) {
  const max = Math.max(1, getMaxCraftableBatch(recipeId));
  state.craftBatchSelection[recipeId] = Math.max(1, Math.min(qty, max));
  renderAll();
}

function startCrafting(recipeId, overrideQty = null) {
  const batchQty = overrideQty || state.craftBatchSelection[recipeId] || 1;
  const plan = resolveCraftingPlan(recipeId, batchQty);
  if (!plan.craftable) {
    showToast('Not enough base materials to craft this batch!', 'rose');
    return;
  }

  const finalStage = plan.stages[plan.stages.length - 1];
  const totalOutputs = finalStage.times * finalStage.recipe.count;

  const nextTask = {
    type: 'crafting',
    targetName: `${totalOutputs}x ${ITEMS[finalStage.recipe.out].name}`,
    stages: plan.stages,
    currentStageIdx: 0,
    currentCraftCount: 0,
    progress: 0
  };

  if (queueReturnBeforeTask(nextTask)) return;

  state.activeTask = nextTask;
  const stageNames = plan.stages.map(s => `${s.times * s.recipe.count}x ${s.outputName}`).join(' → ');
  addLog(`🔨 Started Batch Craft: ${stageNames}`);
  renderAll();
}

/**
 * Checks if the player is currently away from Home Base on an expedition.
 * If so, interrupts the expedition and forces a proportional walk back to Home Base
 * before starting `queuedTask` (or resting if `queuedTask` is null).
 */
function queueReturnBeforeTask(queuedTask = null) {
  const t = state.activeTask;
  if (!t || (t.type !== 'woodcutting' && t.type !== 'mining')) return false;

  const dist = typeof t.distanceRatio === 'number' ? t.distanceRatio : (t.phase === 'walking' || t.phase === 'descending' ? t.progress : 1);
  if (dist <= 0.01) {
    // Virtually at base already
    depositPouchToBank();
    return false;
  }

  // Already returning — just update what happens upon arrival
  if (t.phase === 'returning') {
    t.stopAfterReturn = true;
    t.queuedTask = queuedTask;
    addLog(queuedTask ? `🎒 Returning to Home Base before starting next task...` : `🎒 Returning to Home Base...`);
    renderAll();
    return true;
  }

  // Interrupt current activity and begin proportional return trek
  t.phase = 'returning';
  t.returnStartDist = dist;
  t.progress = 0;
  t.stopAfterReturn = true;
  t.queuedTask = queuedTask;
  addLog(queuedTask
    ? `🥾 Interrupted expedition (${Math.round(dist * 100)}% distance out) — walking back to base first...`
    : `🥾 Stopped expedition (${Math.round(dist * 100)}% distance out) — walking back to Home Base...`);
  renderAll();
  return true;
}

function startBaseUpgradeBuild() {
  const nextBase = BASE_TIERS[state.baseLevel + 1];
  if (!nextBase) return;

  for (const [itemId, reqQty] of Object.entries(nextBase.cost)) {
    if ((state.bank[itemId] || 0) < reqQty) {
      showToast('Missing required building materials!', 'rose');
      return;
    }
  }
  for (const [itemId, reqQty] of Object.entries(nextBase.cost)) {
    removeFromBank(itemId, reqQty);
  }

  const nextTask = {
    type: 'building',
    buildKind: 'core',
    targetLevel: nextBase.level,
    title: `Rebuilding: ${nextBase.name}`,
    duration: nextBase.buildTime,
    elapsed: 0,
    progress: 0,
    soundTick: 0
  };

  if (queueReturnBeforeTask(nextTask)) return;

  state.activeTask = nextTask;
  addLog(`🏗️ Started constructing ${nextBase.name} (${nextBase.buildTime}s)...`);
  renderAll();
}

function startExtensionBuild(extId) {
  const ext = BASE_EXTENSIONS.find(e => e.id === extId);
  if (!ext) return;
  const curLvl = getExtLevel(extId);
  if (curLvl >= ext.maxLevel) return;

  const cost = ext.getCost(curLvl);
  const buildTime = ext.getBuildTime(curLvl);

  for (const [itemId, reqQty] of Object.entries(cost)) {
    if ((state.bank[itemId] || 0) < reqQty) {
      showToast('Missing required extension materials!', 'rose');
      return;
    }
  }
  for (const [itemId, reqQty] of Object.entries(cost)) {
    removeFromBank(itemId, reqQty);
  }

  const nextTask = {
    type: 'building',
    buildKind: 'extension',
    extId: ext.id,
    targetLevel: curLvl + 1,
    title: `Building: ${ext.name} (Lv.${curLvl + 1})`,
    duration: buildTime,
    elapsed: 0,
    progress: 0,
    soundTick: 0
  };

  if (queueReturnBeforeTask(nextTask)) return;

  state.activeTask = nextTask;
  addLog(`🔨 Started building ${ext.name} Lv.${curLvl + 1} (${buildTime}s)...`);
  renderAll();
}

function buildLivestockPen(penIdx) {
  if (penIdx >= getMaxPens()) return;
  const pen = state.pens[penIdx];
  if (!pen || pen.built) return;

  // Authentic Minecraft Pen Cost: 12 Oak Fences + 1 Fence Gate
  if ((state.bank.oak_fence || 0) < 12 || (state.bank.fence_gate || 0) < 1) {
    showToast('Requires 12x Oak Fence and 1x Fence Gate!', 'rose');
    return;
  }
  removeFromBank('oak_fence', 12);
  removeFromBank('fence_gate', 1);
  pen.built = true;
  playSfx('build');
  spawnFloatingText('🪵 Built Livestock Pen!', 'amber');
  addLog(`🪵 Constructed Livestock Pen #${penIdx + 1} with Oak Fences & Gate.`);
  renderAll();
}

function assignAnimalToPen(penIdx, speciesId) {
  const pen = state.pens[penIdx];
  if (!pen || !pen.built) return;
  if (pen.species && pen.species !== speciesId) return;
  if (pen.count >= 8) {
    showToast('This pen is full (max 8 animals)!', 'rose');
    return;
  }
  if (!removeFromBank(speciesId, 1)) {
    showToast(`No ${LIVESTOCK_SPECIES[speciesId].name}s in your Home Base!`, 'rose');
    return;
  }
  pen.species = speciesId;
  pen.count++;
  playSfx('craft');
  addLog(`🐾 Placed a ${LIVESTOCK_SPECIES[speciesId].name} into Pen #${penIdx + 1} (${pen.count}/8).`);
  renderAll();
}

function breedAnimalsInPen(penIdx) {
  const pen = state.pens[penIdx];
  if (!pen || !pen.built || !pen.species || pen.count < 2 || pen.count >= 8) return;
  const spec = LIVESTOCK_SPECIES[pen.species];
  if (!removeFromBank(spec.breedFood, spec.breedCost)) {
    showToast(`Requires ${spec.breedCost}x ${ITEMS[spec.breedFood].name} to breed!`, 'rose');
    return;
  }
  pen.count++;
  playSfx('loot');
  spawnFloatingText(`❤️ Baby ${spec.name} Born!`, 'emerald');
  addLog(`❤️ Bred ${spec.name}s in Pen #${penIdx + 1}! Herd size is now ${pen.count}/8.`);
  renderAll();
}

function harvestPenAnimalForMeat(penIdx) {
  const pen = state.pens[penIdx];
  if (!pen || !pen.built || !pen.species || pen.count <= 0) return;
  const spec = LIVESTOCK_SPECIES[pen.species];
  pen.count--;
  if (pen.species === 'pig') addToBank('raw_porkchop', randInt(2, 3), true);
  else if (pen.species === 'sheep') {
    addToBank('raw_mutton', randInt(1, 2), true);
    addToBank('wool', 1, false);
  } else if (pen.species === 'cow') {
    addToBank('raw_beef', randInt(2, 3), true);
    addToBank('leather', 1, false);
  }
  if (pen.count === 0) {
    pen.species = null;
    pen.progress = 0;
  }
  playSfx('chop');
  renderAll();
}

function startWoodcutting(zoneId) {
  const zone = WOODCUTTING_ZONES.find(z => z.id === zoneId);
  if (!zone) return;
  if (getToolTier('axe') < zone.reqAxeTier) {
    showToast(`Requires a Tier ${zone.reqAxeTier} Axe or better!`, 'rose');
    return;
  }

  const nextTask = {
    type: 'woodcutting',
    zoneId: zone.id,
    phase: 'walking', // 'walking' -> 'chopping' -> 'returning'
    distanceRatio: 0,
    returnStartDist: 1,
    stopAfterReturn: false,
    queuedTask: null,
    progress: 0,
    chopsDone: 0,
    treesFelled: 0,
    pouch: {}
  };

  if (queueReturnBeforeTask(nextTask)) return;

  state.activeTask = nextTask;
  addLog(`🌲 Set out on expedition to ${zone.name}...`);
  renderAll();
}

function startMining(layerId) {
  const layer = MINING_LAYERS.find(l => l.id === layerId);
  if (!layer) return;
  if (getToolTier('pickaxe') < layer.reqPickTier) {
    showToast(`Requires a Tier ${layer.reqPickTier} Pickaxe or better!`, 'rose');
    return;
  }

  const nextTask = {
    type: 'mining',
    layerId: layer.id,
    phase: 'descending', // 'descending' -> 'exploring' -> 'mining' -> 'returning'
    distanceRatio: 0,
    returnStartDist: 1,
    stopAfterReturn: false,
    queuedTask: null,
    progress: 0,
    veinsMined: 0,
    pouch: {}
  };

  if (queueReturnBeforeTask(nextTask)) return;

  state.activeTask = nextTask;
  addLog(`⛏️ Descending into ${layer.name}...`);
  renderAll();
}

function startTendingCrops() {
  const nextTask = {
    type: 'tending',
    progress: 0
  };
  if (queueReturnBeforeTask(nextTask)) return;

  state.activeTask = nextTask;
  addLog(`🌾 Tending Home Base farm plots (2x crop growth + auto-harvest).`);
  renderAll();
}

function toggleFinishHaulAndStop() {
  const t = state.activeTask;
  if (!t || (t.type !== 'woodcutting' && t.type !== 'mining')) return;
  t.stopAfterReturn = !t.stopAfterReturn;
  t.queuedTask = null;
  if (t.stopAfterReturn) {
    addLog(`🎒 Will finish filling current pouch, return to unload, and stop at Home Base.`);
  } else {
    addLog(`🔄 Resumed continuous expedition looping.`);
  }
  renderAll();
}

function stopCurrentAction() {
  if (!state.activeTask) return;
  if (state.activeTask.type === 'woodcutting' || state.activeTask.type === 'mining') {
    queueReturnBeforeTask(null);
    return;
  }
  addLog(`💤 Stopped active task at Home Base.`);
  state.activeTask = null;
  renderAll();
}

function depositPouchToBank() {
  const t = state.activeTask;
  if (!t || !t.pouch) return;
  const entries = Object.entries(t.pouch);
  if (entries.length === 0) return;

  let summary = [];
  for (const [itemId, qty] of entries) {
    const stored = addToBank(itemId, qty, true);
    if (stored > 0) summary.push(`${stored}x ${ITEMS[itemId].name}`);
  }
  if (summary.length > 0) {
    playSfx('loot');
    addLog(`📦 Expedition returned! Deposited: ${summary.join(', ')}.`);
  }
  t.pouch = {};
}

function getPouchTotal(pouch) {
  if (!pouch) return 0;
  return Object.values(pouch).reduce((a, b) => a + b, 0);
}

// Furnace Actions
function addFurnaceFuel(itemId) {
  const item = ITEMS[itemId];
  if (!item || !item.fuelTime) return;
  if (!removeFromBank(itemId, 1)) return;

  state.furnace.fuelRemaining += item.fuelTime;
  state.furnace.fuelMax = Math.max(state.furnace.fuelMax, state.furnace.fuelRemaining);
  state.furnace.fuelItem = itemId;
  playSfx('craft');
  addLog(`🔥 Added 1x ${item.name} to Furnace (+${item.fuelTime}s burn time).`);
  renderAll();
}

function setFurnaceRecipe(recipeId) {
  state.furnace.targetRecipeId = recipeId;
  state.furnace.progress = 0;
  renderAll();
}

// Farming Actions
function plantCrop(plotIdx, cropId) {
  if (plotIdx >= getBaseInfo().farmPlots) return;
  if (!removeFromBank(cropId, 1)) {
    showToast(`No ${ITEMS[cropId]?.name} available in bank!`, 'rose');
    return;
  }
  state.plots[plotIdx] = { cropId, elapsed: 0 };
  playSfx('chop');
  renderAll();
}

function harvestPlot(plotIdx, autoReplant = false) {
  const plot = state.plots[plotIdx];
  if (!plot || !plot.cropId) return;
  const crop = CROPS.find(c => c.id === plot.cropId);
  if (!crop || plot.elapsed < crop.growTime) return;

  const hoeBonus = getToolTier('hoe') >= 3 ? 1 : 0;
  const qty = randInt(crop.yieldMin, crop.yieldMax) + hoeBonus;
  addToBank(crop.yieldItem, qty, true);

  if (crop.seedReturn[1] > 0) {
    const seeds = randInt(crop.seedReturn[0], crop.seedReturn[1]);
    if (seeds > 0) addToBank(crop.id, seeds, false);
  }

  state.stats.cropsHarvested++;
  playSfx('loot');
  addLog(`🌾 Harvested ${qty}x ${ITEMS[crop.yieldItem].name} from Plot #${plotIdx + 1}.`);

  if (autoReplant && (state.bank[crop.id] || 0) > 0) {
    removeFromBank(crop.id, 1);
    state.plots[plotIdx] = { cropId: crop.id, elapsed: 0 };
  } else {
    state.plots[plotIdx] = { cropId: null, elapsed: 0 };
  }
  renderAll();
}

// Home Base Expansion
function upgradeHomeBase() {
  const nextBase = BASE_TIERS[state.baseLevel + 1];
  if (!nextBase) return;

  // Verify cost
  for (const [itemId, reqQty] of Object.entries(nextBase.cost)) {
    if ((state.bank[itemId] || 0) < reqQty) {
      showToast('Missing required building materials!', 'rose');
      return;
    }
  }

  // Deduct cost
  for (const [itemId, reqQty] of Object.entries(nextBase.cost)) {
    removeFromBank(itemId, reqQty);
  }

  state.baseLevel++;
  playSfx('loot');
  spawnFloatingText(`🏰 Upgraded to ${nextBase.name}!`, 'amber');
  addLog(`🏰 Home Base expanded to ${nextBase.name}! Storage capacity increased to ${nextBase.storageCap}.`);
  saveState(true);
  renderAll();
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// ----------------------------------------------------------------------------
// 9. MAIN SIMULATION LOOP (100ms TICKS)
// ----------------------------------------------------------------------------
const TICK_MS = 100;
let saveCounter = 0;

function gameTick() {
  const dt = TICK_MS / 1000;
  const base = getBaseInfo();

  // 1. Update Active Task
  const task = state.activeTask;
  if (task) {
    if (task.type === 'woodcutting') {
      tickWoodcutting(task, dt, base);
    } else if (task.type === 'mining') {
      tickMining(task, dt, base);
    } else if (task.type === 'crafting') {
      tickCrafting(task, dt);
    } else if (task.type === 'tending') {
      tickTending(task, dt);
    } else if (task.type === 'building') {
      tickBuilding(task, dt);
    }
  }

  // 2. Update Background Furnace
  tickFurnace(dt, base);

  // 3. Update Background Farm Plots
  tickFarming(dt);

  // 4. Update Background Livestock Pens
  tickLivestockPens(dt);

  // Periodic Auto-save every 15 seconds
  saveCounter++;
  if (saveCounter >= 150) {
    saveCounter = 0;
    saveState(true);
  }

  updateLiveUI();
}

function tickWoodcutting(task, dt, base) {
  const zone = WOODCUTTING_ZONES.find(z => z.id === task.zoneId);
  if (!zone) return;

  const travelMult = getTravelSpeedMult();
  const axeMult = getToolSpeedMult('axe');
  const pouchCap = getPouchCapacity();

  if (task.phase === 'walking') {
    const duration = zone.walkTime / travelMult;
    task.progress += dt / duration;
    task.distanceRatio = Math.min(1, task.progress);
    if (task.progress >= 1) {
      task.progress = 0;
      task.distanceRatio = 1;
      task.phase = 'chopping';
      task.chopsDone = 0;

      // Wild Animal Encounter & Lure Check during forest/meadow walks!
      if (Math.random() < 0.28 && getPouchTotal(task.pouch) < pouchCap) {
        const candidates = ['pig', 'sheep', 'cow'];
        const wildId = candidates[Math.floor(Math.random() * candidates.length)];
        const spec = LIVESTOCK_SPECIES[wildId];
        // Check if player has lure food in bank (Wheat for Cow/Sheep, Carrot or Potato for Pig)
        let luredWith = null;
        if ((state.bank[spec.lureFood] || 0) >= 1) luredWith = spec.lureFood;
        else if (spec.altFood && (state.bank[spec.altFood] || 0) >= 1) luredWith = spec.altFood;

        if (luredWith) {
          removeFromBank(luredWith, 1);
          task.pouch[wildId] = (task.pouch[wildId] || 0) + 1;
          state.stats.animalsCaptured++;
          playSfx('loot');
          spawnFloatingText(`🐾 Lured wild ${spec.name}!`, 'amber');
          addLog(`🐾 Encountered a wild ${spec.name} and lured it with 1x ${ITEMS[luredWith].name}!`);
        }
      }
    }
  } else if (task.phase === 'chopping') {
    task.distanceRatio = 1;
    const chopDuration = zone.chopTime / axeMult;
    task.progress += dt / chopDuration;
    if (task.progress >= 1) {
      task.progress = 0;
      task.chopsDone++;
      playSfx('chop');
      consumeToolDurability('axe', 1);

      // Check if whole tree is felled!
      if (task.chopsDone >= zone.chopsPerTree) {
        task.chopsDone = 0;
        task.treesFelled++;
        const logs = randInt(zone.logYield[0], zone.logYield[1]);
        task.pouch[zone.logItem] = (task.pouch[zone.logItem] || 0) + logs;
        state.stats.logsChopped += logs;
        spawnFloatingText(`+${logs} ${ITEMS[zone.logItem].name}`, 'emerald');

        if (Math.random() < zone.saplingChance) {
          task.pouch[zone.saplingItem] = (task.pouch[zone.saplingItem] || 0) + 1;
        }

        // Return to base after felling 3 trees (or if pouch reaches capacity)
        if (task.treesFelled >= 3 || getPouchTotal(task.pouch) >= pouchCap) {
          task.phase = 'returning';
          task.returnStartDist = 1;
          task.treesFelled = 0;
        }
      }
    }
  } else if (task.phase === 'returning') {
    const startDist = task.returnStartDist ?? 1;
    const duration = Math.max(0.25, (zone.walkTime * startDist) / travelMult);
    task.progress += dt / duration;
    task.distanceRatio = Math.max(0, startDist * (1 - Math.min(1, task.progress)));
    if (task.progress >= 1) {
      depositPouchToBank();
      task.progress = 0;
      task.distanceRatio = 0;

      if (task.queuedTask) {
        const next = task.queuedTask;
        state.activeTask = next;
        addLog(`🏠 Arrived at Home Base! Starting next task...`);
        renderAll();
        return;
      }

      if (task.stopAfterReturn) {
        addLog(`🏠 Arrived at Home Base, unloaded pouch, and rested.`);
        state.activeTask = null;
        renderAll();
        return;
      }

      // Automatically start next expedition cycle if bank still has room
      if (getTotalStoredItems() < getStorageCap()) {
        task.phase = 'walking';
        task.returnStartDist = 1;
      } else {
        addLog('📦 Home Base storage is full! Expedition paused.');
        state.activeTask = null;
        renderAll();
      }
    }
  }
}

function tickMining(task, dt, base) {
  const layer = MINING_LAYERS.find(l => l.id === task.layerId);
  if (!layer) return;

  const travelMult = getTravelSpeedMult();
  const pickTier = getToolTier('pickaxe');
  const pickMult = getToolSpeedMult('pickaxe');
  const pouchCap = getPouchCapacity();

  if (task.phase === 'descending') {
    const duration = layer.descendTime / travelMult;
    task.progress += dt / duration;
    task.distanceRatio = Math.min(1, task.progress);
    if (task.progress >= 1) {
      task.progress = 0;
      task.distanceRatio = 1;
      task.phase = 'exploring';
    }
  } else if (task.phase === 'exploring') {
    task.distanceRatio = 1;
    // Walk through tunnel to locate next ore vein
    task.progress += dt / layer.stepWalkTime;
    if (task.progress >= 1) {
      task.progress = 0;
      task.phase = 'mining';
    }
  } else if (task.phase === 'mining') {
    task.distanceRatio = 1;
    const duration = layer.mineTime / pickMult;
    task.progress += dt / duration;
    if (task.progress >= 1) {
      task.progress = 0;
      playSfx('mine');
      consumeToolDurability('pickaxe', 1);

      // Roll weighted loot table filtered by current Pickaxe Tier
      const validDrops = layer.lootTable.filter(d => pickTier >= d.reqTier);
      if (validDrops.length > 0) {
        const totalWeight = validDrops.reduce((s, d) => s + d.weight, 0);
        let roll = Math.random() * totalWeight;
        let chosen = validDrops[0];
        for (const drop of validDrops) {
          roll -= drop.weight;
          if (roll <= 0) { chosen = drop; break; }
        }
        const qty = randInt(chosen.min, chosen.max);
        task.pouch[chosen.item] = (task.pouch[chosen.item] || 0) + qty;
        state.stats.blocksMined += qty;
        spawnFloatingText(`+${qty} ${ITEMS[chosen.item].name}`, 'blue');
      }

      task.veinsMined++;
      // Return to base after mining 6 veins in this expedition
      if (task.veinsMined >= 6 || getPouchTotal(task.pouch) >= pouchCap) {
        task.phase = 'returning';
        task.returnStartDist = 1;
        task.veinsMined = 0;
      } else {
        // Walk to next vein
        task.phase = 'exploring';
      }
    }
  } else if (task.phase === 'returning') {
    const startDist = task.returnStartDist ?? 1;
    const duration = Math.max(0.25, (layer.descendTime * startDist) / travelMult);
    task.progress += dt / duration;
    task.distanceRatio = Math.max(0, startDist * (1 - Math.min(1, task.progress)));
    if (task.progress >= 1) {
      depositPouchToBank();
      task.progress = 0;
      task.distanceRatio = 0;

      if (task.queuedTask) {
        const next = task.queuedTask;
        state.activeTask = next;
        addLog(`🏠 Ascended to Home Base! Starting next task...`);
        renderAll();
        return;
      }

      if (task.stopAfterReturn) {
        addLog(`🏠 Ascended to Home Base, unloaded ore pouch, and rested.`);
        state.activeTask = null;
        renderAll();
        return;
      }

      if (getTotalStoredItems() < getStorageCap()) {
        task.phase = 'descending';
        task.returnStartDist = 1;
      } else {
        addLog('📦 Home Base storage is full! Mining expedition paused.');
        state.activeTask = null;
        renderAll();
      }
    }
  }
}

function tickCrafting(task, dt) {
  const stage = task.stages[task.currentStageIdx];
  if (!stage) {
    state.activeTask = null;
    renderAll();
    return;
  }

  task.progress += dt / stage.recipe.time;
  if (task.progress >= 1) {
    task.progress = 0;

    // Verify & consume stage ingredients
    for (const [reqItem, reqQty] of Object.entries(stage.recipe.req)) {
      if ((state.bank[reqItem] || 0) < reqQty) {
        addLog(`⚠️ Crafting halted: ran out of ${ITEMS[reqItem]?.name || reqItem}.`);
        state.activeTask = null;
        renderAll();
        return;
      }
    }
    for (const [reqItem, reqQty] of Object.entries(stage.recipe.req)) {
      removeFromBank(reqItem, reqQty);
    }

    // Produce stage output
    addToBank(stage.recipe.out, stage.recipe.count, true);
    state.stats.itemsCrafted += stage.recipe.count;
    playSfx('craft');

    task.currentCraftCount++;
    if (task.currentCraftCount >= stage.times) {
      addLog(`🔨 Crafted ${stage.times * stage.recipe.count}x ${stage.outputName}.`);
      task.currentStageIdx++;
      task.currentCraftCount = 0;

      if (task.currentStageIdx >= task.stages.length) {
        addLog(`✅ Completed crafting ${task.targetName}!`);
        state.activeTask = null;
        renderAll();
      }
    }
  }
}

function tickBuilding(task, dt) {
  task.elapsed += dt;
  task.progress = Math.min(1, task.elapsed / task.duration);
  task.soundTick = (task.soundTick || 0) + dt;
  if (task.soundTick >= 1.4) {
    task.soundTick = 0;
    playSfx('build');
  }

  if (task.elapsed >= task.duration) {
    if (task.buildKind === 'core') {
      state.baseLevel = task.targetLevel;
      const newBase = getBaseInfo();
      playSfx('loot');
      spawnFloatingText(`🏰 Rebuilt: ${newBase.name}!`, 'amber');
      addLog(`🏰 Finished rebuilding Home Base into ${newBase.name}! Storage Cap: ${getStorageCap()}.`);
    } else if (task.buildKind === 'extension') {
      state.extensions[task.extId] = task.targetLevel;
      const ext = BASE_EXTENSIONS.find(e => e.id === task.extId);
      playSfx('loot');
      spawnFloatingText(`🏗️ ${ext.name} Lv.${task.targetLevel}!`, 'amber');
      addLog(`🏗️ Completed ${ext.name} Level ${task.targetLevel}!`);
    }
    state.activeTask = null;
    saveState(true);
    renderAll();
  }
}

function tickTending(task, dt) {
  const hoeMult = getToolSpeedMult('hoe');
  task.progress = (task.progress + dt * 0.5) % 1;
  if (Math.random() < 0.03) {
    consumeToolDurability('hoe', 1);
  }
  const unlockedPlots = getBaseInfo().farmPlots;
  for (let i = 0; i < unlockedPlots; i++) {
    const plot = state.plots[i];
    if (plot && plot.cropId) {
      const crop = CROPS.find(c => c.id === plot.cropId);
      if (crop && plot.elapsed >= crop.growTime) {
        harvestPlot(i, true);
      } else if (crop) {
        // Extra bonus speed on top of tickFarming
        plot.elapsed += dt * (0.8 * hoeMult);
      }
    }
  }
}

function tickFurnace(dt, base) {
  const f = state.furnace;
  const smeltMult = getSmeltSpeedMult();

  if (f.fuelRemaining > 0) {
    f.fuelRemaining = Math.max(0, f.fuelRemaining - dt);
  }

  if (!f.targetRecipeId) {
    f.progress = 0;
    return;
  }

  const recipe = SMELTING_RECIPES.find(r => r.id === f.targetRecipeId);
  if (!recipe) return;

  const haveInput = (state.bank[recipe.inItem] || 0) >= 1;
  if (!haveInput) {
    f.progress = 0;
    return;
  }

  // Auto-feed fuel if fire went out and Coal or Charcoal is in the bank
  if (f.fuelRemaining <= 0) {
    if ((state.bank.charcoal || 0) > 0) {
      addFurnaceFuel('charcoal');
    } else if ((state.bank.coal || 0) > 0) {
      addFurnaceFuel('coal');
    } else {
      f.progress = 0;
      return;
    }
  }

  f.progress += (dt * smeltMult) / recipe.time;
  if (f.progress >= 1) {
    f.progress = 0;
    if (removeFromBank(recipe.inItem, 1)) {
      addToBank(recipe.outItem, recipe.count, true);
      state.stats.itemsSmelted += recipe.count;
      playSfx('loot');
    }
  }
}

function tickFarming(dt) {
  const unlockedPlots = getBaseInfo().farmPlots;
  const hoeMult = getToolSpeedMult('hoe');
  const tendingBonus = state.activeTask?.type === 'tending' ? 1.5 * hoeMult : 1.0;

  for (let i = 0; i < unlockedPlots; i++) {
    const plot = state.plots[i];
    if (!plot || !plot.cropId) continue;
    const crop = CROPS.find(c => c.id === plot.cropId);
    if (!crop) continue;
    if (plot.elapsed < crop.growTime) {
      plot.elapsed = Math.min(crop.growTime, plot.elapsed + dt * tendingBonus);
    }
  }
}

function tickLivestockPens(dt) {
  const maxPens = getMaxPens();
  const yieldMult = getRanchYieldMult();
  const hasShears = (state.bank.shears || 0) > 0;

  for (let i = 0; i < maxPens; i++) {
    const pen = state.pens[i];
    if (!pen || !pen.built || !pen.species || pen.count <= 0) continue;
    const spec = LIVESTOCK_SPECIES[pen.species];
    if (!spec) continue;

    // More animals in a pen speed up production cycle
    const herdSpeed = 1 + (pen.count - 1) * 0.35;
    const shearSpeed = (pen.species === 'sheep' && hasShears) ? 1.35 : 1.0;
    pen.progress += (dt * herdSpeed * shearSpeed) / spec.cycleTime;

    if (pen.progress >= 1) {
      pen.progress = 0;
      let qty = Math.max(1, Math.round(randInt(spec.produceMin, spec.produceMax) * yieldMult));
      if (pen.species === 'sheep' && hasShears) qty *= 2;
      addToBank(spec.produceItem, qty, false);

      if (spec.bonusItem && Math.random() < spec.bonusChance) {
        addToBank(spec.bonusItem, 1, false);
      }
      if (pen.species === 'cow' && Math.random() < 0.25) {
        addToBank('raw_beef', 1, false);
      }
    }
  }
}

function updateActiveTabProgress() {
  const tab = state.activeTab;
  const task = state.activeTask;

  if (tab === 'woodcutting' && task?.type === 'woodcutting') {
    const bar = document.getElementById('live-exp-bar');
    const lbl = document.getElementById('live-exp-label');
    const pouchBox = document.getElementById('live-pouch-items');
    if (bar) bar.style.width = `${Math.min(100, Math.round(task.progress * 100))}%`;
    if (lbl) {
      const zone = WOODCUTTING_ZONES.find(z => z.id === task.zoneId);
      if (task.phase === 'walking') lbl.textContent = `Walking to ${zone.name}... (${Math.round((task.distanceRatio || 0) * 100)}%)`;
      else if (task.phase === 'chopping') lbl.textContent = `Chopping tree: ${task.chopsDone}/${zone.chopsPerTree} hits (Trees felled: ${task.treesFelled}/3)`;
      else lbl.textContent = `Walking back to Home Base with timber... (${Math.round((1 - (task.distanceRatio || 0)) * 100)}%)`;
    }
    if (pouchBox) pouchBox.innerHTML = renderPouchBadges(task.pouch);
  }

  if (tab === 'mining' && task?.type === 'mining') {
    const bar = document.getElementById('live-exp-bar');
    const lbl = document.getElementById('live-exp-label');
    const pouchBox = document.getElementById('live-pouch-items');
    if (bar) bar.style.width = `${Math.min(100, Math.round(task.progress * 100))}%`;
    if (lbl) {
      const layer = MINING_LAYERS.find(l => l.id === task.layerId);
      if (task.phase === 'descending') lbl.textContent = `Descending to ${layer.name}... (${Math.round((task.distanceRatio || 0) * 100)}%)`;
      else if (task.phase === 'exploring') lbl.textContent = `Walking through tunnel searching for ore vein (${task.veinsMined + 1}/6)...`;
      else if (task.phase === 'mining') lbl.textContent = `Mining vein ${task.veinsMined + 1}/6...`;
      else lbl.textContent = `Ascending shaft back to Home Base... (${Math.round((1 - (task.distanceRatio || 0)) * 100)}%)`;
    }
    if (pouchBox) pouchBox.innerHTML = renderPouchBadges(task.pouch);
  }

  if (tab === 'smelting') {
    const f = state.furnace;
    const fuelBar = document.getElementById('furnace-fuel-bar');
    const fuelTxt = document.getElementById('furnace-fuel-text');
    const progBar = document.getElementById('furnace-prog-bar');
    if (fuelBar) fuelBar.style.width = f.fuelMax > 0 ? `${Math.min(100, (f.fuelRemaining / f.fuelMax) * 100)}%` : '0%';
    if (fuelTxt) fuelTxt.textContent = f.fuelRemaining > 0 ? `${f.fuelRemaining.toFixed(1)}s burn left` : 'Out of fuel';
    if (progBar) progBar.style.width = `${Math.min(100, Math.round(f.progress * 100))}%`;
  }

  if (tab === 'farming') {
    const unlockedPlots = getBaseInfo().farmPlots;
    for (let i = 0; i < unlockedPlots; i++) {
      const plot = state.plots[i];
      const bar = document.getElementById(`plot-bar-${i}`);
      const status = document.getElementById(`plot-status-${i}`);
      if (plot?.cropId && bar && status) {
        const crop = CROPS.find(c => c.id === plot.cropId);
        const pct = Math.min(100, Math.round((plot.elapsed / crop.growTime) * 100));
        bar.style.width = `${pct}%`;
        if (pct >= 100) {
          status.textContent = 'Ready to Harvest!';
          status.className = 'text-xs font-bold text-emerald-400';
        } else {
          status.textContent = `Growing (${Math.ceil(crop.growTime - plot.elapsed)}s)`;
        }
      }
    }
  }

  if (tab === 'pens') {
    const maxPens = getMaxPens();
    for (let i = 0; i < maxPens; i++) {
      const pen = state.pens[i];
      const bar = document.getElementById(`pen-bar-${i}`);
      const pctTxt = document.getElementById(`pen-pct-${i}`);
      if (pen?.built && pen.species && bar && pctTxt) {
        const pct = Math.min(100, Math.round((pen.progress || 0) * 100));
        bar.style.width = `${pct}%`;
        pctTxt.textContent = `${pct}%`;
      }
    }
  }
}

function renderPouchBadges(pouch) {
  const entries = Object.entries(pouch || {});
  if (entries.length === 0) return '<span class="text-xs text-slate-500 italic">Pouch is currently empty...</span>';
  return entries.map(([id, qty]) => `
    <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-lg bg-melvor-bg border border-melvor-border text-xs font-medium text-slate-200">
      ${getItemSvg(ITEMS[id]?.icon || id, 16)}
      <span>${ITEMS[id]?.name || id}</span>
      <span class="font-mono font-bold text-amber-400">x${qty}</span>
    </div>
  `).join('');
}

          <span class="text-[10px] font-mono text-slate-500">1.0x</span>
        </div>
      `;
    }
    const item = ITEMS[eq.id];
    const durPct = Math.max(0, Math.round((eq.durability / eq.maxDurability) * 100));
    const barColor = durPct > 50 ? 'bg-emerald-500' : durPct > 20 ? 'bg-amber-500' : 'bg-rose-500';
    return `
      <div class="px-2.5 py-1.5 rounded-lg bg-melvor-panel border border-melvor-border text-xs">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-2 font-medium text-slate-200 truncate">
            ${getItemSvg(eq.id, 18)}
            <span class="truncate">${item.name}</span>
          </div>
          <span class="text-[10px] font-mono text-emerald-400 shrink-0">${item.speedMult}x</span>
        </div>
        <div class="mt-1 flex items-center gap-2">
          <div class="flex-1 h-1.5 bg-melvor-bg rounded-full overflow-hidden">
            <div class="h-full ${barColor}" style="width: ${durPct}%"></div>
          </div>
          <span class="text-[10px] font-mono text-slate-400">${eq.durability}/${eq.maxDurability}</span>
        </div>
      </div>
    `;
  }).join('');
}

function renderAll() {
  // Highlight active nav button
  document.querySelectorAll('.nav-btn').forEach(btn => {
    const isMatch = btn.dataset.tab === state.activeTab;
    btn.className = isMatch
      ? 'nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-semibold bg-melvor-card text-white border border-melvor-border shadow-sm'
      : 'nav-btn w-full flex items-center justify-between px-3 py-2.5 rounded-lg text-sm font-medium text-slate-400 hover:text-slate-200 hover:bg-melvor-card/50 transition';
  });

  renderSidebarTools();
  renderLogDrawer();

  const main = document.getElementById('main-content');
  if (state.activeTab === 'base') main.innerHTML = renderBaseTab();
  else if (state.activeTab === 'woodcutting') main.innerHTML = renderWoodcuttingTab();
  else if (state.activeTab === 'mining') main.innerHTML = renderMiningTab();
  else if (state.activeTab === 'crafting') main.innerHTML = renderCraftingTab();
  else if (state.activeTab === 'smelting') main.innerHTML = renderSmeltingTab();
  else if (state.activeTab === 'farming') main.innerHTML = renderFarmingTab();
  else if (state.activeTab === 'pens') main.innerHTML = renderPensTab();

  updateLiveUI();
}

// ----------------------------------------------------------------------------
// TAB 1: HOME BASE & BANK
// ----------------------------------------------------------------------------
function renderBaseTab() {
  const base = getBaseInfo();
  const nextBase = BASE_TIERS[state.baseLevel + 1];
  const stored = getTotalStoredItems();
  const cap = getStorageCap();
  const capPct = Math.min(100, Math.round((stored / cap) * 100));
  const isBuildingCore = state.activeTask?.type === 'building' && state.activeTask.buildKind === 'core';

  let upgradeHtml = '';
  if (nextBase) {
    let canAfford = true;
    const costBadges = Object.entries(nextBase.cost).map(([itemId, req]) => {
      const have = state.bank[itemId] || 0;
      const ok = have >= req;
      if (!ok) canAfford = false;
      return `
        <div class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg border text-xs font-mono ${ok ? 'bg-emerald-950/30 border-emerald-500/40 text-emerald-300' : 'bg-rose-950/30 border-rose-500/40 text-rose-300'}">
          ${getItemSvg(ITEMS[itemId]?.icon || itemId, 16)}
          <span>${ITEMS[itemId]?.name}: ${have}/${req}</span>
        </div>
      `;
    }).join('');

    upgradeHtml = `
      <div class="mt-4 pt-4 border-t border-melvor-border flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <div class="text-xs font-bold uppercase tracking-wider text-purple-400">Rebuild Main Structure: ${nextBase.name}</div>
          <p class="text-xs text-slate-400 mt-0.5">Base Storage ${base.storageCap} → <strong class="text-white">${nextBase.storageCap}</strong> • Farm Plots ${base.farmPlots} → <strong class="text-white">${nextBase.farmPlots}</strong> • Base Pens ${base.maxPens} → <strong class="text-white">${nextBase.maxPens}</strong> • Build Time: <strong class="text-purple-300">${nextBase.buildTime}s</strong></p>
          <div class="flex flex-wrap gap-2 mt-2.5">${costBadges}</div>
        </div>
        ${isBuildingCore ? `
          <div class="px-5 py-2.5 rounded-xl font-bold text-sm bg-purple-900/50 border border-purple-500/50 text-purple-200 shrink-0">
            🏗️ Rebuilding in Progress...
          </div>
        ` : `
          <button onclick="startBaseUpgradeBuild()" ${canAfford ? '' : 'disabled'} class="px-5 py-2.5 rounded-xl font-bold text-sm transition shrink-0 ${canAfford ? 'bg-melvor-base hover:bg-purple-500 text-white shadow-lg shadow-purple-900/30' : 'bg-melvor-bg text-slate-500 border border-melvor-border cursor-not-allowed'}">
            🏗️ Rebuild Base (${nextBase.buildTime}s)
          </button>
        `}
      </div>
    `;
  } else {
    upgradeHtml = `<div class="mt-4 pt-3 border-t border-melvor-border text-xs font-semibold text-purple-300">✨ Maximum Home Base Tier Reached!</div>`;
  }

  // Modular Base Extensions Grid
  const extensionsHtml = BASE_EXTENSIONS.map(ext => {
    const curLvl = getExtLevel(ext.id);
    const isMax = curLvl >= ext.maxLevel;
    const isBuildingThis = state.activeTask?.type === 'building' && state.activeTask.buildKind === 'extension' && state.activeTask.extId === ext.id;
    const cost = isMax ? null : ext.getCost(curLvl);
    const buildTime = isMax ? 0 : ext.getBuildTime(curLvl);

    let canAfford = !isMax;
    const costPills = isMax ? '' : Object.entries(cost).map(([itemId, req]) => {
      const have = state.bank[itemId] || 0;
      const ok = have >= req;
      if (!ok) canAfford = false;
      return `
        <span class="inline-flex items-center gap-1 px-2 py-0.5 rounded border text-[11px] font-mono ${ok ? 'bg-emerald-950/30 border-emerald-500/30 text-emerald-300' : 'bg-rose-950/30 border-rose-500/30 text-rose-300'}">
          ${getItemSvg(ITEMS[itemId]?.icon || itemId, 13)} ${have}/${req}
        </span>
      `;
    }).join('');

    return `
      <div class="bg-melvor-card border ${curLvl > 0 ? 'border-purple-500/35' : 'border-melvor-border'} rounded-xl p-4 flex flex-col justify-between">
        <div>
          <div class="flex items-center justify-between gap-2">
            <h4 class="font-bold text-white text-sm">${ext.name}</h4>
            <span class="text-[11px] font-mono px-2 py-0.5 rounded bg-melvor-bg border border-melvor-border text-purple-300">Lv. ${curLvl}/${ext.maxLevel}</span>
          </div>
          <p class="text-xs text-slate-400 mt-1.5 leading-relaxed">${ext.desc}</p>
          <div class="mt-2.5 text-[11px] font-mono text-emerald-400">
            Active Bonus: ${curLvl > 0 ? ext.effectLabel(curLvl) : 'None yet'}
          </div>
          ${!isMax ? `
            <div class="mt-2 pt-2 border-t border-melvor-border/60">
              <div class="text-[10px] uppercase font-bold text-slate-400 mb-1">Next (${ext.nextEffectLabel}) • ${buildTime}s build:</div>
              <div class="flex flex-wrap gap-1.5">${costPills}</div>
            </div>
          ` : ''}
        </div>
        <div class="mt-3">
          ${isMax ? `
            <div class="w-full py-1.5 rounded-lg bg-purple-950/40 border border-purple-500/30 text-purple-300 text-xs font-bold text-center">✓ Max Extension Level</div>
          ` : isBuildingThis ? `
            <div class="w-full py-1.5 rounded-lg bg-purple-600/30 border border-purple-500 text-purple-200 text-xs font-bold text-center animate-pulse">🔨 Constructing Lv.${curLvl + 1}...</div>
          ` : `
            <button onclick="startExtensionBuild('${ext.id}')" ${canAfford ? '' : 'disabled'} class="w-full py-2 rounded-lg text-xs font-bold transition ${canAfford ? 'bg-purple-600 hover:bg-purple-500 text-white shadow' : 'bg-melvor-bg text-slate-500 border border-melvor-border cursor-not-allowed'}">
              Build Extension Lv.${curLvl + 1} (${buildTime}s)
            </button>
          `}
        </div>
      </div>
    `;
  }).join('');

  // Bank Inventory Filter & Items Grid
  const allBankEntries = Object.entries(state.bank).filter(([, qty]) => qty > 0);
  const filter = state.bankFilter || 'all';
  const filteredEntries = allBankEntries.filter(([itemId]) => {
    if (filter === 'all') return true;
    const cat = ITEMS[itemId]?.category;
    if (filter === 'resources') return cat === 'resource' || cat === 'material';
    if (filter === 'tools') return cat === 'tool';
    if (filter === 'farm') return cat === 'seed' || cat === 'crop' || cat === 'food' || cat === 'livestock';
    return true;
  });

  const bankCards = filteredEntries.length === 0
    ? `<div class="col-span-full py-10 text-center text-sm text-slate-500 bg-melvor-card/40 rounded-xl border border-dashed border-melvor-border">No items in this category yet. Gather wood, mine ores, or craft tools!</div>`
    : filteredEntries.map(([itemId, qty]) => {
        const item = ITEMS[itemId] || { name: itemId, category: 'resource' };
        const isTool = item.category === 'tool';
        return `
          <div onclick="openItemModal('${itemId}')" class="group cursor-pointer bg-melvor-card hover:bg-melvor-cardHover border border-melvor-border hover:border-slate-500 rounded-xl p-3 flex flex-col justify-between transition">
            <div class="flex items-start justify-between gap-2">
              <div class="w-10 h-10 rounded-lg bg-melvor-bg border border-melvor-border flex items-center justify-center">
                ${getItemSvg(item.icon || itemId, 26)}
              </div>
              <span class="px-2 py-0.5 rounded-md bg-melvor-bg border border-melvor-border font-mono text-xs font-bold text-white">${qty}</span>
            </div>
            <div class="mt-2.5">
              <div class="text-xs font-semibold text-slate-200 group-hover:text-white truncate">${item.name}</div>
              <div class="text-[10px] text-slate-400 capitalize mt-0.5">${isTool ? `Tier ${item.tier} • ${item.maxDurability} Dur` : item.category}</div>
            </div>
            ${isTool ? `<button onclick="event.stopPropagation(); equipToolFromBank('${itemId}')" class="mt-2 w-full py-1 rounded-md bg-emerald-600/20 hover:bg-emerald-600 text-emerald-300 hover:text-white border border-emerald-500/40 text-[11px] font-semibold transition">Equip</button>` : ''}
          </div>
        `;
      }).join('');

  return `
    <!-- Home Base Card -->
    <section class="bg-melvor-panel border border-melvor-border rounded-2xl p-5 shadow-lg">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
        <div class="flex items-center gap-3.5">
          <div class="w-12 h-12 rounded-xl bg-purple-500/15 border border-purple-500/40 flex items-center justify-center text-2xl">🏡</div>
          <div>
            <div class="flex items-center gap-2">
              <h2 class="text-lg font-extrabold text-white">${base.name}</h2>
              <span class="text-xs font-mono px-2 py-0.5 rounded bg-purple-500/20 text-purple-300">Tier ${base.level}</span>
            </div>
            <p class="text-xs text-slate-400 mt-0.5">${base.desc}</p>
          </div>
        </div>
        <div class="bg-melvor-bg border border-melvor-border rounded-xl px-4 py-2.5 min-w-[190px]">
          <div class="flex items-center justify-between text-xs mb-1">
            <span class="text-slate-400">Chest Storage</span>
            <span class="font-mono font-bold text-white">${stored} / ${cap}</span>
          </div>
          <div class="w-full h-2 bg-melvor-panel rounded-full overflow-hidden">
            <div class="h-full bg-melvor-base transition-all" style="width: ${capPct}%"></div>
          </div>
        </div>
      </div>
      ${upgradeHtml}
    </section>

    <!-- Modular Home Base Extensions -->
    <section class="bg-melvor-panel border border-melvor-border rounded-2xl p-5 shadow-lg">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2 mb-4">
        <div>
          <h3 class="text-base font-bold text-white">Home Base Extensions & Wings</h3>
          <p class="text-xs text-slate-400">Expand your homestead incrementally with specialized rooms before rebuilding the main structure.</p>
        </div>
        <span class="text-xs font-mono text-purple-300 bg-purple-500/10 border border-purple-500/30 px-2.5 py-1 rounded-lg">Active Construction</span>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3.5">
        ${extensionsHtml}
      </div>
    </section>

    <!-- Bank Chest Grid -->
    <section class="bg-melvor-panel border border-melvor-border rounded-2xl p-5 shadow-lg">
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-4">
        <div>
          <h3 class="text-base font-bold text-white">Home Base Chests (Bank)</h3>
          <p class="text-xs text-slate-400">Click any item to inspect, equip, or discard excess stacks.</p>
        </div>
        <div class="flex flex-wrap gap-1.5">
          ${['all', 'resources', 'tools', 'farm'].map(f => `
            <button onclick="state.bankFilter='${f}'; renderAll();" class="px-3 py-1.5 rounded-lg text-xs font-semibold capitalize transition ${filter === f ? 'bg-emerald-600 text-white' : 'bg-melvor-card text-slate-300 hover:bg-melvor-cardHover border border-melvor-border'}">${f === 'farm' ? 'Farm & Ranch' : f}</button>
          `).join('')}
        </div>
      </div>
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-3">
        ${bankCards}
      </div>
    </section>
  `;
}

      <div class="bg-melvor-panel border ${isRunning ? 'border-emerald-500' : 'border-melvor-border'} rounded-2xl p-5 flex flex-col justify-between shadow-md">

            <div>
              <div class="text-[10px] text-slate-400 uppercase">Walk</div>
              <div class="text-xs font-mono font-bold text-slate-200 mt-0.5">${walkSec}s</div>
            </div>
            <div>
              <div class="text-[10px] text-slate-400 uppercase">Fell Tree</div>
              <div class="text-xs font-mono font-bold text-emerald-400 mt-0.5">${treeSec}s (${z.chopsPerTree} hits)</div>
            </div>
            <div>
              <div class="text-[10px] text-slate-400 uppercase">Yield</div>
              <div class="text-xs font-mono font-bold text-amber-300 mt-0.5">${z.logYield[0]}-${z.logYield[1]} Logs</div>
            </div>
          </div>
        </div>

        <button onclick="startWoodcutting('${z.id}')" ${unlocked ? '' : 'disabled'} class="mt-4 w-full py-2.5 rounded-xl text-xs font-bold transition ${isRunning ? 'bg-emerald-600/30 text-emerald-300 border border-emerald-500/50' : unlocked ? 'bg-melvor-wood hover:bg-emerald-500 text-white shadow' : 'bg-melvor-bg text-slate-500 border border-melvor-border cursor-not-allowed'}">

        <button onclick="startMining('${l.id}')" ${unlocked ? '' : 'disabled'} class="mt-4 w-full py-2.5 rounded-xl text-xs font-bold transition ${isRunning ? 'bg-blue-600/30 text-blue-300 border border-blue-500/50' : unlocked ? 'bg-melvor-mine hover:bg-blue-500 text-white shadow' : 'bg-melvor-bg text-slate-500 border border-melvor-border cursor-not-allowed'}">
          ${isRunning ? '⛏️ Mining Expedition Active' : unlocked ? 'Descend & Mine Layer' : `Locked (Craft Tier ${l.reqPickTier} Pickaxe)`}

  }).join('');

  return `
    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-2">

        <h2 class="text-xl font-extrabold text-white">Subterranean Mining</h2>

        Mining Speed: ${pickMult.toFixed(2)}x • Ascent Speed: ${travelMult.toFixed(2)}x

    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${layerCards}</div>
